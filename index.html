<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="制作物と自己紹介を掲載するポートフォリオです。">
  <meta name="color-scheme" content="light">
  <title>ポートフォリオ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="./style.css">
  <script src="./site-data.js" defer></script>
  <script src="./photos/gallery.js" defer></script>
  <script src="./technologies/technologies.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" id="header-name" href="#top">ポートフォリオ</a>
      <nav aria-label="ページ内ナビゲーション">
        <ul class="nav-list">
          <li id="nav-projects"><a href="#projects">制作物 | <span lang="en">Works</span></a></li>
          <li id="nav-photos"><a href="#photos">写真 | <span lang="en">photo</span></a></li>
          <li id="nav-about"><a href="#about">自己紹介 | <span lang="en">About</span></a></li>
          <li id="nav-technologies"><a href="#technologies">技術紹介 | <span lang="en">Technologies</span></a></li>
          <li id="nav-contact"><a href="#contact">連絡先 | <span lang="en">Contact</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="hero-name">
      <div class="hero-inner container">
        <p class="eyebrow">PORTFOLIO</p>
        <h1 id="hero-name">ポートフォリオ</h1>
        <p class="hero-role" id="hero-role" hidden></p>
        <svg class="hero-mark" viewBox="0 0 144 144" fill="none" aria-hidden="true" focusable="false">
          <rect x="37" y="37" width="70" height="70" rx="3"></rect>
          <rect x="50" y="50" width="44" height="44" rx="1"></rect>
          <path d="M52 27v10m20-10v10m20-10v10M52 107v10m20-10v10m20-10v10M27 52h10M27 72h10M27 92h10m70-40h10m-10 20h10m-10 20h10"></path>
          <path d="M61 72h22M72 61v22"></path>
        </svg>
        <a class="hero-next" id="hero-next" href="#projects" aria-label="次のセクションへ">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 9l7 7 7-7"></path></svg>
        </a>
      </div>
    </section>

    <noscript><p class="notice container">このページの内容を表示するには、JavaScript を有効にしてください。</p></noscript>

    <section class="section works-section" id="projects" aria-labelledby="projects-title" hidden>
      <div class="container">
        <div class="section-heading"><h2 id="projects-title">制作物 | <span lang="en">Works</span></h2></div>
        <div class="project-list" id="project-list"></div>
      </div>
    </section>

    <section class="section photos-section" id="photos" aria-labelledby="photos-title">
      <div class="container">
        <div class="section-heading"><h2 id="photos-title">写真 | <span lang="en">photo</span></h2></div>
        <div class="photo-list" id="photo-list"></div>
        <p class="photo-empty" id="photo-empty">写真はまだありません。</p>
      </div>
    </section>

    <section class="section about-section" id="about" aria-labelledby="about-title" hidden>
      <div class="container narrow">
        <div class="section-heading"><h2 id="about-title">自己紹介 | <span lang="en">About</span></h2></div>
        <div class="profile-mark" id="profile-mark" aria-hidden="true"></div>
        <p class="about-text" id="about-text" hidden></p>
        <ul class="skill-list" id="skill-list" aria-label="スキル" hidden></ul>
      </div>
    </section>

    <section class="section technologies-section" id="technologies" aria-labelledby="technologies-title">
      <div class="container narrow">
        <div class="section-heading"><h2 id="technologies-title">技術紹介 | <span lang="en">Technologies</span></h2></div>
        <ul class="technology-entries" id="technology-entries"></ul>
        <p class="technology-empty" id="technology-empty">技術はまだ登録されていません。</p>
      </div>
    </section>

    <section class="section contact-section" id="contact" aria-labelledby="contact-title" hidden>
      <div class="container narrow">
        <div class="section-heading"><h2 id="contact-title">連絡先 | <span lang="en">Contact</span></h2></div>
        <ul class="contact-list" id="contact-list"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container footer-inner"><span id="footer-name">ポートフォリオ</span></div></footer>
</body>
</html>
